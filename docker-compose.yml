# Docker Compose configuration for Java Unit Test Agent
# Note: version field is obsolete in Compose V2, removed

services:
  # ==================== Graph Database ====================
  # Note: Graph database is now SQLite-based (no separate service needed)
  # SQLite database file will be stored in ./data/code_graph.db

  # ==================== Vector Database ====================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: java-agent-qdrant
    ports:
      - "6333:6333"   # HTTP API
      - "6334:6334"   # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - java-agent-network
    restart: unless-stopped

  # ==================== Cache / Message Broker ====================
  redis:
    image: redis:7-alpine
    container_name: java-agent-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - java-agent-network
    restart: unless-stopped

  # ==================== Monitoring ====================
  prometheus:
    image: prom/prometheus:latest
    container_name: java-agent-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - java-agent-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: java-agent-grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3001
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - java-agent-network
    restart: unless-stopped

  # ==================== Python API (Uncomment when ready) ====================
  # python-api:
  #   build:
  #     context: ./python
  #     dockerfile: Dockerfile
  #   container_name: java-agent-api
  #   ports:
  #     - "8000:8000"
  #   volumes:
  #     - ./python:/app
  #     - sqlite_data:/app/data  # SQLite database persistence
  #   environment:
  #     - QDRANT_HOST=qdrant
  #     - REDIS_HOST=redis
  #   env_file:
  #     - .env
  #   depends_on:
  #     qdrant:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   networks:
  #     - java-agent-network
  #   restart: unless-stopped


volumes:
  # SQLite graph database data (mounted to ./data directory)
  sqlite_data:
    driver: local
  qdrant_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  java-agent-network:
    driver: bridge
    name: java-agent-network

